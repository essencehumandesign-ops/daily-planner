<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ting's Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAF7F1; --paper-line: #DDD5C4; --ink: #262420; --ink-soft: #6B6459; --ink-faint: #B4AC9C;
    --sage: #5C7A66; --sage-deep: #3F5A4B; --sage-bg: #E7EEE8;
    --amber: #C1893C; --amber-bg: #FBEEDA;
    --rose: #B0514A; --rose-bg: #F5E2DF;
    --done: #B9C2B0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 28px 18px 64px; }
  .title { font-family: 'Source Serif 4', serif; font-size: 28px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .subtitle { color: var(--ink-soft); font-size: 14px; margin: 0 0 20px; }

  .top-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--paper-line); margin-bottom: 24px; }
  .top-tab { font-family: 'Source Serif 4', serif; font-size: 16px; background: none; border: none; padding: 10px 4px 12px; margin-right: 20px; cursor: pointer; color: var(--ink-soft); position: relative; top: 1px; }
  .top-tab.active { color: var(--sage-deep); border-bottom: 2px solid var(--sage-deep); font-weight: 600; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .routines-box { border: 1px solid var(--paper-line); border-radius: 4px; padding: 14px 16px; margin-bottom: 20px; background: #fff; }
  .routines-head { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .routines-head h2 { font-family: 'Source Serif 4', serif; font-size: 16px; font-weight: 600; margin: 0; }
  .routines-head .count { font-size: 12.5px; color: var(--ink-soft); }
  .routines-body { margin-top: 12px; display: none; }
  .routines-box.open .routines-body { display: block; }
  .routine-chip { display: flex; align-items: flex-start; gap: 8px; padding: 8px 0; border-top: 1px solid var(--paper-line); font-size: 13.5px; }
  .routine-chip:first-child { border-top: none; }
  .routine-chip .r-time { font-family: 'Source Serif 4', serif; color: var(--sage-deep); width: 48px; flex-shrink: 0; padding-top: 1px; }
  .routine-chip .r-main { flex: 1; }
  .routine-chip .r-text { display: block; }
  .routine-chip .r-days { display: block; font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .routine-chip button { background: none; border: none; color: var(--ink-faint); cursor: pointer; font-size: 14px; padding: 0 2px; }
  .routine-chip button:hover { color: #A8452F; }

  .recur-toggle { display: flex; gap: 4px; margin-top: 12px; }
  .recur-btn { font-size: 12px; padding: 6px 12px; border: 1px solid var(--paper-line); border-radius: 3px; background: var(--paper); color: var(--ink-soft); cursor: pointer; }
  .recur-btn.on { background: var(--sage-deep); border-color: var(--sage-deep); color: #fff; }

  .day-picker { display: flex; gap: 4px; margin: 10px 0 8px; flex-wrap: wrap; }
  .day-toggle { font-size: 11.5px; padding: 5px 8px; border: 1px solid var(--paper-line); border-radius: 3px; background: var(--paper); color: var(--ink-soft); cursor: pointer; user-select: none; }
  .day-toggle.on { background: var(--sage-deep); border-color: var(--sage-deep); color: #fff; }
  .day-picker-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
  .day-picker-label { font-size: 11.5px; color: var(--ink-soft); }
  .day-picker-quick { background: none; border: none; text-decoration: underline; color: var(--sage-deep); font-size: 11.5px; cursor: pointer; padding: 0; }

  .month-day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 8px 0; max-width: 320px; }
  .month-day-btn { font-size: 11px; padding: 5px 0; border: 1px solid var(--paper-line); border-radius: 3px; background: var(--paper); color: var(--ink-soft); cursor: pointer; text-align: center; }
  .month-day-btn.on { background: var(--sage-deep); border-color: var(--sage-deep); color: #fff; }
  .last-day-btn { font-size: 11.5px; padding: 6px 10px; border: 1px solid var(--paper-line); border-radius: 3px; background: var(--paper); color: var(--ink-soft); cursor: pointer; margin-top: 2px; }
  .last-day-btn.on { background: var(--amber); border-color: var(--amber); color: #fff; }

  .field-row { display: grid; grid-template-columns: 84px 1fr auto; gap: 6px; margin-top: 10px; }
  .field-row input[type="time"], .field-row input[type="text"] { font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; padding: 7px 8px; border: 1px solid var(--paper-line); border-radius: 3px; background: var(--paper); }
  .field-row input:focus { outline: none; border-color: var(--sage); }
  .field-row button { background: var(--sage-deep); color: #fff; border: none; border-radius: 3px; font-size: 13px; padding: 0 14px; cursor: pointer; }
  .field-row button:hover { background: var(--sage); }

  .special-box { border: 1px solid #E3C4BE; border-radius: 4px; padding: 14px 16px; margin-bottom: 26px; background: var(--rose-bg); }
  .special-box h2 { font-family: 'Source Serif 4', serif; font-size: 16px; font-weight: 600; margin: 0 0 2px; color: #7A362F; }
  .special-box .hint { font-size: 12.5px; color: #8A5A54; margin: 0 0 10px; }
  .special-field-row { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
  .special-field-row input { font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; padding: 8px 10px; border: 1px solid #E3C4BE; border-radius: 3px; background: #fff; }
  .special-field-row input:focus { outline: none; border-color: var(--rose); }
  .special-field-row button { background: var(--rose); color: #fff; border: none; border-radius: 3px; font-size: 13px; padding: 0 14px; cursor: pointer; }
  .special-field-row button:hover { background: #96453F; }
  .special-hint-row { font-size: 11.5px; color: #8A5A54; margin-top: 6px; }

  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .month-nav h2 { font-family: 'Source Serif 4', serif; font-size: 19px; font-weight: 600; margin: 0; }
  .nav-btn { background: #fff; border: 1px solid var(--paper-line); border-radius: 3px; width: 30px; height: 30px; cursor: pointer; font-size: 14px; color: var(--ink-soft); }
  .nav-btn:hover { border-color: var(--sage); color: var(--sage-deep); }

  .weekday-row { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 4px; }
  .weekday-row span { text-align: center; font-size: 11.5px; color: var(--ink-soft); padding-bottom: 4px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cell { min-height: 92px; border: 1px solid var(--paper-line); border-radius: 3px; background: #fff; padding: 5px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; position: relative; overflow: hidden; }
  .cell.outside { background: transparent; border-color: transparent; cursor: default; }
  .cell.outside .daynum { color: var(--ink-faint); }
  .cell:hover:not(.outside) { border-color: var(--sage); }
  .cell.today { border-color: var(--amber); border-width: 2px; }
  .cell.selected { background: var(--sage-bg); border-color: var(--sage-deep); }
  .cell.has-special:not(.outside) { box-shadow: inset 0 0 0 1px var(--rose); }
  .daynum { font-family: 'Source Serif 4', serif; font-size: 13px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; }
  .daynum .flag { font-size: 10px; }
  .cell-items { display: flex; flex-direction: column; gap: 1px; overflow: hidden; }
  .cell-item { font-size: 9.5px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-soft); }
  .cell-item.pending { color: var(--ink); }
  .cell-item.done { color: var(--ink-faint); text-decoration: line-through; }
  .cell-item.special { color: var(--rose); font-weight: 500; }
  .cell-more { font-size: 9.5px; color: var(--ink-faint); }

  .day-panel { margin-top: 28px; }
  .day-panel-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .day-head { font-family: 'Source Serif 4', serif; font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .day-sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 14px; }
  .quick-nav { display: flex; gap: 6px; }
  .quick-btn { font-size: 12px; padding: 5px 10px; border: 1px solid var(--paper-line); border-radius: 3px; background: #fff; color: var(--ink-soft); cursor: pointer; }
  .quick-btn:hover { border-color: var(--sage); color: var(--sage-deep); }
  .quick-btn.active { background: var(--sage-deep); border-color: var(--sage-deep); color: #fff; }

  .banner { display: none; align-items: flex-start; gap: 10px; background: var(--amber-bg); border: 1px solid #E8C994; border-radius: 3px; padding: 11px 13px; margin-bottom: 16px; font-size: 13.5px; cursor: pointer; }
  .banner.show { display: flex; }
  .banner b { color: var(--amber); }

  .entry-row { display: grid; grid-template-columns: 26px 52px 1fr auto; align-items: start; gap: 10px; padding: 11px 0; border-top: 1px solid var(--paper-line); }
  .entry-row:last-of-type { border-bottom: 1px solid var(--paper-line); }
  .entry-row.special { background: var(--rose-bg); margin: 0 -10px; padding: 11px 10px; border-top: none; border-radius: 3px; }
  .entry-row.special + .entry-row { border-top: 1px solid var(--paper-line); }
  .entry-check { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--sage-deep); cursor: pointer; }
  .entry-row.special .entry-check { accent-color: var(--rose); }
  .entry-time { font-family: 'Source Serif 4', serif; font-size: 13.5px; color: var(--ink-soft); padding-top: 2px; }
  .entry-row.due .entry-time { color: var(--amber); font-weight: 600; }
  .entry-row.done .entry-time { color: var(--done); }
  .entry-text { font-size: 14px; line-height: 1.5; padding-top: 2px; word-break: break-word; }
  .entry-row.done .entry-text { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--done); }
  .entry-row.special .entry-text { color: #7A362F; }
  .entry-row.special.done .entry-text { color: #A87C77; }
  .entry-tag { font-size: 10.5px; color: var(--sage-deep); background: var(--sage-bg); border-radius: 2px; padding: 1px 5px; margin-left: 6px; white-space: nowrap; }
  .entry-tag.special-tag { color: var(--rose); background: #fff; }
  .entry-row.due { animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { background: transparent; } 50% { background: var(--amber-bg); } }
  .icon-btn { background: none; border: 1px solid var(--paper-line); border-radius: 3px; width: 25px; height: 25px; font-size: 12px; cursor: pointer; color: var(--ink-soft); display: flex; align-items: center; justify-content: center; }
  .icon-btn:hover { border-color: var(--sage); color: var(--sage-deep); }
  .icon-btn:disabled { opacity: 0.35; cursor: default; }
  .icon-btn:disabled:hover { border-color: var(--paper-line); color: var(--ink-soft); }

  .empty { padding: 22px 0; color: var(--ink-soft); font-size: 13.5px; font-style: italic; border-top: 1px solid var(--paper-line); border-bottom: 1px solid var(--paper-line); }

  .add-row { margin-top: 18px; display: grid; grid-template-columns: 100px 1fr auto; gap: 8px; }
  .add-row input { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; padding: 9px 10px; border: 1px solid var(--paper-line); border-radius: 3px; background: #fff; color: var(--ink); }
  .add-row input:focus { outline: none; border-color: var(--sage); }
  .add-row button { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 500; padding: 0 16px; background: var(--sage-deep); color: #fff; border: none; border-radius: 3px; cursor: pointer; }
  .add-row button:hover { background: var(--sage); }

  .foot-note { margin-top: 16px; font-size: 12px; color: var(--ink-soft); }
  .foot-note button { background: none; border: none; color: var(--sage-deep); text-decoration: underline; cursor: pointer; font-size: 12px; padding: 0; }

  .loading { padding: 20px 0; color: var(--ink-soft); font-size: 14px; }

  /* Earnings tab */
  .stat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
  .stat-card { border: 1px solid var(--paper-line); border-radius: 4px; background: #fff; padding: 12px 14px; }
  .stat-card .stat-label { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.03em; }
  .stat-card .stat-value { font-family: 'Source Serif 4', serif; font-size: 20px; font-weight: 600; margin-top: 4px; }
  .stat-card.net .stat-value { color: var(--sage-deep); font-size: 32px; }
  .stat-card.fee .stat-value { color: var(--rose); }

  .earn-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .earn-toolbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .export-btn { font-family: 'IBM Plex Sans', sans-serif; font-size: 12.5px; padding: 7px 12px; border: 1px solid var(--paper-line); border-radius: 3px; background: #fff; color: var(--sage-deep); cursor: pointer; font-weight: 500; }
  .export-btn:hover { border-color: var(--sage); background: var(--sage-bg); }
  .year-tabs { display: flex; gap: 4px; }
  .year-tab { font-family: 'Source Serif 4', serif; font-size: 13.5px; padding: 6px 14px; border: 1px solid var(--paper-line); border-radius: 3px; background: #fff; color: var(--ink-soft); cursor: pointer; }
  .year-tab.active { background: var(--sage-deep); border-color: var(--sage-deep); color: #fff; font-weight: 600; }
  .earn-filter label { font-size: 11.5px; color: var(--ink-soft); margin-right: 6px; }
  .earn-filter select { font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; padding: 6px 8px; border: 1px solid var(--paper-line); border-radius: 3px; background: #fff; }

  .collapse-box { border: 1px solid var(--paper-line); border-radius: 4px; padding: 14px 16px; margin-bottom: 18px; background: #fff; }
  .collapse-head { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .collapse-head h2 { font-family: 'Source Serif 4', serif; font-size: 15px; font-weight: 600; margin: 0; }
  .collapse-body { margin-top: 12px; display: none; }
  .collapse-box.open .collapse-body { display: block; }

  .earn-form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .earn-field label { display: block; font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; }
  .earn-field input, .earn-field select, .earn-field textarea {
    width: 100%; font-family: 'IBM Plex Sans', sans-serif; font-size: 13.5px; padding: 8px 9px;
    border: 1px solid var(--paper-line); border-radius: 3px; background: var(--paper);
  }
  .earn-field textarea { resize: vertical; min-height: 36px; font-family: inherit; }
  .earn-field input:focus, .earn-field select:focus, .earn-field textarea:focus { outline: none; border-color: var(--sage); }
  .earn-field.span-3 { grid-column: span 3; }
  .earn-add-btn { background: var(--sage-deep); color: #fff; border: none; border-radius: 3px; font-size: 13.5px; padding: 9px 16px; cursor: pointer; margin-top: 12px; }
  .earn-add-btn:hover { background: var(--sage); }

  .offweek-box { border: 1px solid #E3C4BE; border-radius: 4px; padding: 14px 16px; margin-bottom: 22px; background: var(--rose-bg); }
  .offweek-box h2 { font-family: 'Source Serif 4', serif; font-size: 15px; font-weight: 600; margin: 0 0 2px; color: #7A362F; }
  .offweek-box .hint { font-size: 12px; color: #8A5A54; margin: 0 0 10px; }
  .offweek-form { display: grid; grid-template-columns: 150px 1fr auto; gap: 8px; }
  .offweek-form input { font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; padding: 8px 9px; border: 1px solid #E3C4BE; border-radius: 3px; background: #fff; }
  .offweek-form button { background: var(--rose); color: #fff; border: none; border-radius: 3px; font-size: 13px; padding: 0 14px; cursor: pointer; }
  .offweek-form button:hover { background: #96453F; }

  .week-group { margin-bottom: 18px; }
  .week-group-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 8px; flex-wrap: wrap; gap: 6px; background: var(--sage-bg); border-radius: 3px; padding: 8px 12px; }
  .week-group-label { font-family: 'Source Serif 4', serif; font-size: 14.5px; font-weight: 600; color: var(--sage-deep); }
  .week-group-total { font-size: 14px; color: var(--sage-deep); font-weight: 700; }
  .off-week-banner { background: var(--rose-bg); border: 1px solid #E3C4BE; border-radius: 3px; padding: 9px 12px; font-size: 13px; color: #7A362F; margin-bottom: 8px; display: flex; align-items: flex-start; gap: 8px; justify-content: space-between; }
  .off-week-banner .txt b { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 2px; }
  .off-week-banner button { background: none; border: none; color: #7A362F; cursor: pointer; font-size: 13px; opacity: 0.7; }
  .off-week-banner button:hover { opacity: 1; }

  .month-totals { margin-bottom: 28px; }
  .month-totals-label { font-family: 'Source Serif 4', serif; font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .year-total-row { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0 10px; }
  .year-total-row .yt-label { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.03em; }
  .year-total-row .yt-value { font-family: 'Source Serif 4', serif; font-size: 22px; font-weight: 700; color: var(--sage-deep); }
  .month-total-row { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--paper-line); font-size: 13.5px; }
  .month-total-row:last-child { border-bottom: 1px solid var(--paper-line); }
  .month-total-row .mt-net { font-weight: 600; color: var(--sage-deep); }

  .earn-card { border: 1px solid var(--paper-line); border-radius: 4px; background: #fff; padding: 10px 12px; margin-bottom: 6px; }
  .earn-card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .earn-card-left { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .earn-card-date { font-family: 'Source Serif 4', serif; font-size: 13.5px; color: var(--ink); font-weight: 600; }
  .earn-card-mommy { font-size: 11px; background: var(--sage-bg); color: var(--sage-deep); padding: 1px 7px; border-radius: 2px; }
  .earn-card-location { font-size: 11px; background: var(--amber-bg); color: var(--amber); padding: 1px 7px; border-radius: 2px; }
  .earn-card-net { font-weight: 700; color: var(--sage-deep); font-size: 15px; }
  .earn-card-right { display: flex; align-items: center; gap: 8px; }
  .earn-card-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .meta-chip { font-size: 11px; color: var(--ink-soft); background: var(--paper); border: 1px solid var(--paper-line); border-radius: 2px; padding: 2px 7px; }
  .earn-card-notes { font-size: 12px; color: var(--ink); margin-top: 6px; font-style: italic; padding-top: 6px; border-top: 1px dashed var(--paper-line); }
  .pay-tag { font-size: 10.5px; padding: 2px 7px; border-radius: 2px; white-space: nowrap; font-weight: 600; }
  .pay-tag.full { background: var(--sage-bg); color: var(--sage-deep); }
  .pay-tag.partial { background: var(--amber-bg); color: var(--amber); }
  .pay-tag.not_received { background: var(--rose-bg); color: var(--rose); }

  @media (max-width: 620px) {
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .earn-form-grid { grid-template-columns: 1fr 1fr; }
    .earn-field.span-3 { grid-column: span 2; }
    .offweek-form { grid-template-columns: 1fr; }
  }
  @media (max-width: 480px) {
    .add-row { grid-template-columns: 1fr; }
    .field-row { grid-template-columns: 1fr; }
    .special-field-row { grid-template-columns: 1fr; }
    .entry-row { grid-template-columns: 20px 44px 1fr auto; }
    .cell { min-height: 64px; padding: 4px; }
    .cell-item { font-size: 8.5px; }
  }

  /* ---- FOA earnings tab ---- */
  .headline-card { border: 1px solid var(--paper-line); border-radius: 4px; background: #fff; padding: 20px 22px; margin-bottom: 20px; }
  .headline-card .hl-label { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.03em; }
  .headline-card .hl-value { font-family: 'Source Serif 4', serif; font-size: 36px; font-weight: 700; color: var(--sage-deep); margin-top: 4px; }
  .headline-card .hl-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; }

  .foa-add-row { display: grid; grid-template-columns: 130px 100px 100px 100px 1fr auto; gap: 8px; margin-bottom: 6px; align-items: end; }
  .foa-add-row .earn-field { min-width: 0; }
  .foa-add-hint { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 22px; }

  .foa-month-row { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--paper-line); font-size: 14px; }
  .foa-month-row:last-child { border-bottom: 1px solid var(--paper-line); }
  .foa-month-row .fm-net { font-weight: 700; color: var(--sage-deep); font-size: 15px; }

  .breakdown-row { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--paper-line); font-size: 13px; }

  @media (max-width: 700px) {
    .foa-add-row { grid-template-columns: 1fr 1fr; }

  }
  @media (max-width: 480px) {

    .simple-entry-row .se-gross, .simple-entry-row .se-ded { display: none; }
    .simple-entry-row .se-notes { grid-column: 1 / -1; }
    .spend-entry-row { grid-template-columns: 70px 1fr auto; }
    .spend-entry-row .sp-card, .spend-entry-row .sp-category { grid-column: span 1; }
  }

<body>
<div class="wrap">
  <p class="title">Ting's sheet</p>
  <p class="subtitle">Work, life, and earnings — all in one place.</p>

  <div class="top-tabs" id="topTabs">
    <button class="top-tab active" data-tab="work" type="button">Work daily</button>
    <button class="top-tab" data-tab="life" type="button">Daily life</button>
    <button class="top-tab" data-tab="earnings" type="button">Earnings</button>
    <button class="top-tab" data-tab="foa" type="button">FOA earnings</button>
    <button class="top-tab" data-tab="spending" type="button">Spending</button>
  </div>

  <div class="tab-panel active" id="tab-work"></div>
  <div class="tab-panel" id="tab-life"></div>
  <div class="tab-panel" id="tab-earnings"></div>
  <div class="tab-panel" id="tab-foa"></div>
  <div class="tab-panel" id="tab-spending"></div>
</div>

<script>
/* ============ Supabase REST helpers ============ */
const SUPABASE_URL = 'https://ugqxjllupahpgyiierqt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVncXhqbGx1cGFocGd5aWllcnF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0ODE0ODMsImV4cCI6MjA5NTA1NzQ4M30.1V9loHRvwQ8jj7f20aXUWSzRftTPdHrPvNu4D__5F2Q';
const REST_BASE = `${SUPABASE_URL}/rest/v1`;
const SB_HEADERS = { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` };

async function sbGetPlan(storageKey) {
  try {
    const res = await fetch(`${REST_BASE}/daily_plan_store?key=eq.${storageKey}&select=value`, { headers: SB_HEADERS });
    if (res.ok) { const rows = await res.json(); if (rows && rows[0]) return rows[0].value; }
  } catch (e) { console.error('load error', e); }
  return null;
}
async function sbSavePlan(storageKey, value) {
  try {
    await fetch(`${REST_BASE}/daily_plan_store`, {
      method: 'POST',
      headers: { ...SB_HEADERS, 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify([{ key: storageKey, value, updated_at: new Date().toISOString() }])
    });
  } catch (e) { console.error('save error', e); }
}

/* ============ Shared helpers ============ */
const WEEKDAY_LABELS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DUE_WINDOW_MIN = 5;
const MAX_CELL_ITEMS = 3;

function pad(n) { return String(n).padStart(2, '0'); }
function dateKey(y, m, d) { return `${y}-${pad(m + 1)}-${pad(d)}`; }
function todayKey() { const t = new Date(); return dateKey(t.getFullYear(), t.getMonth(), t.getDate()); }
function tomorrowKey() { const t = new Date(); t.setDate(t.getDate() + 1); return dateKey(t.getFullYear(), t.getMonth(), t.getDate()); }
function weekdayIndex(key) { const [y, m, d] = key.split('-').map(Number); const jsDay = new Date(y, m - 1, d).getDay(); return (jsDay + 6) % 7; }
function lastDayOfMonth(key) { const [y, m] = key.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function minutesSince(timeStr, key) {
  const now = new Date();
  const [y, m, d] = key.split('-').map(Number);
  const [h, mi] = timeStr.split(':').map(Number);
  return (now - new Date(y, m - 1, d, h, mi)) / 60000;
}
function ordinal(n) {
  const s = ['th','st','nd','rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
function escapeHtml(s) { const div = document.createElement('div'); div.textContent = s; return div.innerHTML; }

function routineApplies(r, key) {
  if (r.recurrence === 'monthly') {
    const dom = Number(key.split('-')[2]);
    if (r.lastDay && dom === lastDayOfMonth(key)) return true;
    return (r.dates || []).includes(dom);
  }
  const wd = weekdayIndex(key);
  return (r.days || []).includes(wd);
}

/* ============ Planner factory (used for Work daily + Daily life) ============ */
function createPlanner(prefix, storageKey) {
  let data = { routines: [], days: {} };
  let viewYear, viewMonth, selectedKey = null, dismissedBanner = false;
  let notifiedIds = new Set();
  let recurrence = 'weekly';
  let routineDaySelection = [0,1,2,3,4,5,6];
  let routineDateSelection = [];
  let routineLastDay = false;

  function el(id) { return document.getElementById(prefix + '-' + id); }

  function ensureDay(key) {
    if (!data.days[key]) data.days[key] = { tasks: [], routineDone: {}, special: [] };
    const day = data.days[key];
    if (!Array.isArray(day.tasks)) day.tasks = [];
    if (!day.routineDone) day.routineDone = {};
    if (!Array.isArray(day.special)) day.special = [];
    return day;
  }

  function combinedList(key) {
    const day = data.days[key] || { tasks: [], routineDone: {}, special: [] };
    const specialItems = (day.special || []).map(s => ({ id: 's-' + s.id, specialId: s.id, time: '', text: s.text, done: !!s.done, isSpecial: true }));
    const routineItems = data.routines.filter(r => routineApplies(r, key)).map(r => ({ id: 'r-' + r.id, routineId: r.id, time: r.time, text: r.text, done: !!day.routineDone[r.id], isRoutine: true }));
    const taskItems = (day.tasks || []).map(t => ({ ...t, isRoutine: false }));
    const timed = routineItems.concat(taskItems).sort((a, b) => a.time.localeCompare(b.time));
    return specialItems.concat(timed);
  }

  function itemStatus(item, key) {
    if (item.done) return 'done';
    if (item.isSpecial) return 'upcoming';
    if (key === todayKey()) { const mins = minutesSince(item.time, key); if (mins >= 0 && mins <= DUE_WINDOW_MIN) return 'due'; }
    return 'upcoming';
  }

  function daysLabel(r) {
    if (r.recurrence === 'monthly') {
      const parts = (r.dates || []).slice().sort((a,b)=>a-b).map(ordinal);
      if (r.lastDay) parts.push('last day');
      return parts.length ? 'Monthly: ' + parts.join(', ') : 'Monthly';
    }
    const d = r.days || [];
    if (d.length === 7) return 'Every day';
    if (d.length === 5 && [0,1,2,3,4].every(x => d.includes(x))) return 'Weekdays';
    return d.slice().sort((a,b)=>a-b).map(i => WEEKDAY_LABELS[i]).join(', ');
  }

  /* ---- routine add form ---- */
  function renderRecurToggle() {
    el('recurWeekly').classList.toggle('on', recurrence === 'weekly');
    el('recurMonthly').classList.toggle('on', recurrence === 'monthly');
    el('weeklyPicker').style.display = recurrence === 'weekly' ? '' : 'none';
    el('monthlyPicker').style.display = recurrence === 'monthly' ? '' : 'none';
  }
  function renderRoutineDayPicker() {
    const box = el('routineDayPicker'); box.innerHTML = '';
    WEEKDAY_LABELS.forEach((label, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'day-toggle' + (routineDaySelection.includes(i) ? ' on' : '');
      btn.textContent = label;
      btn.addEventListener('click', () => {
        if (routineDaySelection.includes(i)) routineDaySelection = routineDaySelection.filter(x => x !== i);
        else routineDaySelection.push(i);
        renderRoutineDayPicker();
      });
      box.appendChild(btn);
    });
  }
  function renderMonthDayPicker() {
    const box = el('monthDayGrid'); box.innerHTML = '';
    for (let d = 1; d <= 31; d++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'month-day-btn' + (routineDateSelection.includes(d) ? ' on' : '');
      btn.textContent = d;
      btn.addEventListener('click', () => {
        if (routineDateSelection.includes(d)) routineDateSelection = routineDateSelection.filter(x => x !== d);
        else routineDateSelection.push(d);
        renderMonthDayPicker();
      });
      box.appendChild(btn);
    }
    el('lastDayBtn').classList.toggle('on', routineLastDay);
  }

  function renderRoutines() {
    const list = el('routinesList');
    el('routinesCount').textContent = data.routines.length === 0 ? 'none yet' : `${data.routines.length} recurring`;
    if (data.routines.length === 0) {
      list.innerHTML = '<p style="color:var(--ink-soft); font-size:13px; margin:4px 0 0;">No recurring routines yet — add one below.</p>';
      return;
    }
    list.innerHTML = '';
    data.routines.slice().sort((a,b)=>a.time.localeCompare(b.time)).forEach(r => {
      const row = document.createElement('div'); row.className = 'routine-chip';
      const time = document.createElement('span'); time.className = 'r-time'; time.textContent = r.time;
      const main = document.createElement('span'); main.className = 'r-main';
      const text = document.createElement('span'); text.className = 'r-text'; text.textContent = r.text;
      const daysSpan = document.createElement('span'); daysSpan.className = 'r-days'; daysSpan.textContent = daysLabel(r);
      main.appendChild(text); main.appendChild(daysSpan);
      const del = document.createElement('button'); del.type = 'button'; del.textContent = '×'; del.title = 'Remove routine';
      del.addEventListener('click', () => removeRoutine(r.id));
      row.appendChild(time); row.appendChild(main); row.appendChild(del);
      list.appendChild(row);
    });
  }

  async function addRoutine(time, text) {
    const r = { id: Date.now().toString(36), time, text: text.trim(), recurrence };
    if (recurrence === 'monthly') { r.dates = routineDateSelection.slice(); r.lastDay = routineLastDay; }
    else { r.days = routineDaySelection.slice(); }
    data.routines.push(r);
    await save();
    renderRoutines(); renderGrid(); renderDayPanel();
  }
  async function removeRoutine(id) {
    data.routines = data.routines.filter(r => r.id !== id);
    await save();
    renderRoutines(); renderGrid(); renderDayPanel();
  }

  function renderMonthLabel() {
    el('monthLabel').textContent = new Date(viewYear, viewMonth, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  }

  function renderGrid() {
    const grid = el('grid'); grid.innerHTML = '';
    const firstOfMonth = new Date(viewYear, viewMonth, 1);
    const startOffset = (firstOfMonth.getDay() + 6) % 7;
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
    const cells = [];
    for (let i = 0; i < startOffset; i++) cells.push({ day: daysInPrevMonth - startOffset + i + 1, outside: true });
    for (let d = 1; d <= daysInMonth; d++) cells.push({ day: d, outside: false });
    while (cells.length % 7 !== 0 || cells.length < 35) cells.push({ day: cells.length - startOffset - daysInMonth + 1, outside: true });

    cells.forEach(c => {
      const cell = document.createElement('div');
      let key = null;
      if (!c.outside) {
        key = dateKey(viewYear, viewMonth, c.day);
        cell.className = 'cell';
        if (key === todayKey()) cell.classList.add('today');
        if (key === selectedKey) cell.classList.add('selected');
      } else cell.className = 'cell outside';

      const num = document.createElement('div'); num.className = 'daynum'; num.textContent = c.day; cell.appendChild(num);

      if (!c.outside) {
        const items = combinedList(key);
        const hasOpenSpecial = items.some(it => it.isSpecial && !it.done);
        if (hasOpenSpecial) { cell.classList.add('has-special'); const flag = document.createElement('span'); flag.className = 'flag'; flag.textContent = '🚩'; num.appendChild(flag); }
        if (items.length > 0) {
          const box = document.createElement('div'); box.className = 'cell-items';
          items.slice(0, MAX_CELL_ITEMS).forEach(it => {
            const line = document.createElement('div');
            const status = itemStatus(it, key);
            line.className = 'cell-item ' + (it.isSpecial ? 'special' : status);
            line.textContent = (it.isSpecial ? '🚩 ' : (it.time ? it.time + ' ' : '')) + it.text;
            box.appendChild(line);
          });
          if (items.length > MAX_CELL_ITEMS) { const more = document.createElement('div'); more.className = 'cell-more'; more.textContent = `+${items.length - MAX_CELL_ITEMS} more`; box.appendChild(more); }
          cell.appendChild(box);
        }
        cell.addEventListener('click', () => { selectedKey = key; dismissedBanner = false; renderGrid(); renderDayPanel(); });
      }
      grid.appendChild(cell);
    });
  }

  function renderDayPanel() {
    if (!selectedKey) return;
    const [y, m, d] = selectedKey.split('-').map(Number);
    const dateObj = new Date(y, m - 1, d);
    el('dayHead').textContent = dateObj.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    el('daySub').textContent = selectedKey === todayKey() ? 'Today' : (selectedKey === tomorrowKey() ? 'Tomorrow' : '');
    el('gotoToday').classList.toggle('active', selectedKey === todayKey());
    el('gotoTomorrow').classList.toggle('active', selectedKey === tomorrowKey());

    const listEl = el('dayList');
    const items = combinedList(selectedKey);
    if (items.length === 0) {
      listEl.innerHTML = '<div class="empty">Nothing logged for this day yet.</div>';
    } else {
      listEl.innerHTML = '';
      items.forEach(item => {
        const status = itemStatus(item, selectedKey);
        const row = document.createElement('div');
        row.className = 'entry-row' + (item.isSpecial ? ' special' : '') + (status === 'due' ? ' due' : '') + (status === 'done' ? ' done' : '');
        const check = document.createElement('input'); check.type = 'checkbox'; check.className = 'entry-check'; check.checked = !!item.done;
        check.title = item.isSpecial ? 'Mark handled' : 'Mark done';
        check.addEventListener('change', () => toggleDone(item));
        const time = document.createElement('div'); time.className = 'entry-time'; time.textContent = item.isSpecial ? '' : item.time;
        const text = document.createElement('div'); text.className = 'entry-text';
        text.textContent = (status === 'due' && !item.isSpecial ? '🔔 ' : '') + item.text;
        if (item.isRoutine) { const tag = document.createElement('span'); tag.className = 'entry-tag'; tag.textContent = 'routine'; text.appendChild(tag); }
        if (item.isSpecial) { const tag = document.createElement('span'); tag.className = 'entry-tag special-tag'; tag.textContent = item.done ? 'handled' : 'needs attention'; text.appendChild(tag); }
        const delBtn = document.createElement('button'); delBtn.type = 'button'; delBtn.className = 'icon-btn'; delBtn.textContent = '×';
        delBtn.title = item.isRoutine ? 'Manage in Daily routines above' : 'Remove';
        delBtn.disabled = item.isRoutine;
        if (!item.isRoutine) delBtn.addEventListener('click', () => item.isSpecial ? removeSpecial(item.specialId) : removeTask(item.id));
        row.appendChild(check); row.appendChild(time); row.appendChild(text); row.appendChild(delBtn);
        listEl.appendChild(row);
      });
    }
    renderBanner(items);
    renderFootNote();
    updateSpecialTargetLabel();
  }

  function updateSpecialTargetLabel() {
    const targetEl = el('specialTargetLabel'); if (!targetEl || !selectedKey) return;
    const [y, m, d] = selectedKey.split('-').map(Number);
    const label = new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
    targetEl.textContent = `Flags the selected date on the calendar: ${label}`;
  }

  function renderBanner(items) {
    const banner = el('banner'), text = el('bannerText');
    if (dismissedBanner || selectedKey !== todayKey()) { banner.classList.remove('show'); return; }
    const due = items.filter(it => !it.done && !it.isSpecial && itemStatus(it, selectedKey) === 'due');
    if (due.length === 0) { banner.classList.remove('show'); return; }
    text.innerHTML = due.length === 1 ? `It's time for <b>${escapeHtml(due[0].text)}</b>.` : `<b>${due.length} things</b> are due right now.`;
    banner.classList.add('show');
  }

  function renderFootNote() {
    const noteEl = el('footNote');
    if (selectedKey === todayKey()) {
      noteEl.innerHTML = `<button id="${prefix}-notifyBtn" type="button">Turn on browser reminders</button>`;
      const btn = document.getElementById(prefix + '-notifyBtn');
      if (btn && 'Notification' in window) {
        if (Notification.permission === 'granted') { btn.textContent = 'Browser reminders on'; btn.disabled = true; }
        btn.addEventListener('click', async () => { const perm = await Notification.requestPermission(); if (perm === 'granted') { btn.textContent = 'Browser reminders on'; btn.disabled = true; } });
      } else if (btn) btn.style.display = 'none';
    } else noteEl.textContent = '';
  }

  async function save() { await sbSavePlan(storageKey, data); }

  async function addTask(time, text) { const day = ensureDay(selectedKey); day.tasks.push({ id: Date.now().toString(36), time, text: text.trim(), done: false }); await save(); renderGrid(); renderDayPanel(); }
  async function removeTask(id) { const day = ensureDay(selectedKey); day.tasks = day.tasks.filter(t => t.id !== id); await save(); renderGrid(); renderDayPanel(); }
  async function addSpecial(text) { const day = ensureDay(selectedKey); day.special.push({ id: Date.now().toString(36), text: text.trim(), done: false }); await save(); renderGrid(); renderDayPanel(); }
  async function removeSpecial(id) { const day = ensureDay(selectedKey); day.special = day.special.filter(s => s.id !== id); await save(); renderGrid(); renderDayPanel(); }
  async function toggleDone(item) {
    const day = ensureDay(selectedKey);
    if (item.isRoutine) day.routineDone[item.routineId] = !day.routineDone[item.routineId];
    else if (item.isSpecial) { const s = day.special.find(x => x.id === item.specialId); if (s) s.done = !s.done; }
    else { const t = day.tasks.find(x => x.id === item.id); if (t) t.done = !t.done; }
    await save(); renderGrid(); renderDayPanel();
  }

  function checkReminders() {
    if (selectedKey !== todayKey()) return;
    const items = combinedList(todayKey());
    const due = items.filter(it => !it.done && !it.isSpecial && itemStatus(it, todayKey()) === 'due');
    due.forEach(it => { if (!notifiedIds.has(it.id) && 'Notification' in window && Notification.permission === 'granted') { new Notification("Ting's sheet", { body: it.text }); notifiedIds.add(it.id); } });
    renderGrid(); renderDayPanel();
  }

  function wire() {
    el('routinesHead').addEventListener('click', () => el('routinesBox').classList.toggle('open'));
    el('recurWeekly').addEventListener('click', () => { recurrence = 'weekly'; renderRecurToggle(); });
    el('recurMonthly').addEventListener('click', () => { recurrence = 'monthly'; renderRecurToggle(); });
    el('quickEveryDay').addEventListener('click', () => { routineDaySelection = [0,1,2,3,4,5,6]; renderRoutineDayPicker(); });
    el('lastDayBtn').addEventListener('click', () => { routineLastDay = !routineLastDay; renderMonthDayPicker(); });
    el('addRoutineBtn').addEventListener('click', () => {
      const t = el('routineTime'), x = el('routineText');
      if (!t.value || !x.value.trim()) return;
      if (recurrence === 'weekly' && routineDaySelection.length === 0) return;
      if (recurrence === 'monthly' && routineDateSelection.length === 0 && !routineLastDay) return;
      addRoutine(t.value, x.value); x.value = '';
    });
    el('routineText').addEventListener('keydown', e => { if (e.key === 'Enter') el('addRoutineBtn').click(); });
    el('prevMonth').addEventListener('click', () => { viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } renderMonthLabel(); renderGrid(); });
    el('nextMonth').addEventListener('click', () => { viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } renderMonthLabel(); renderGrid(); });
    el('addTaskBtn').addEventListener('click', () => { const t = el('timeInput'), x = el('textInput'); if (!t.value || !x.value.trim()) return; addTask(t.value, x.value); x.value = ''; });
    el('textInput').addEventListener('keydown', e => { if (e.key === 'Enter') el('addTaskBtn').click(); });
    el('addSpecialBtn').addEventListener('click', () => { const x = el('specialInput'); if (!x.value.trim()) return; addSpecial(x.value); x.value = ''; });
    el('specialInput').addEventListener('keydown', e => { if (e.key === 'Enter') el('addSpecialBtn').click(); });
    el('banner').addEventListener('click', () => { dismissedBanner = true; renderBanner(combinedList(selectedKey)); });
    el('gotoToday').addEventListener('click', () => { const key = todayKey(); const [y,m] = key.split('-').map(Number); viewYear=y; viewMonth=m-1; selectedKey=key; dismissedBanner=false; renderMonthLabel(); renderGrid(); renderDayPanel(); });
    el('gotoTomorrow').addEventListener('click', () => { const key = tomorrowKey(); const [y,m] = key.split('-').map(Number); viewYear=y; viewMonth=m-1; selectedKey=key; dismissedBanner=false; renderMonthLabel(); renderGrid(); renderDayPanel(); });
  }

  async function init() {
    const today = new Date();
    viewYear = today.getFullYear(); viewMonth = today.getMonth(); selectedKey = todayKey();
    const loaded = await sbGetPlan(storageKey);
    if (loaded) data = loaded;
    if (!Array.isArray(data.routines)) data.routines = [];
    if (!data.days || typeof data.days !== 'object') data.days = {};
    data.routines.forEach(r => { if (!r.recurrence) r.recurrence = 'weekly'; if (r.recurrence==='weekly' && !Array.isArray(r.days)) r.days=[0,1,2,3,4,5,6]; if (r.recurrence==='monthly' && !Array.isArray(r.dates)) r.dates=[]; });
    wire();
    renderRecurToggle();
    renderRoutineDayPicker();
    renderMonthDayPicker();
    renderRoutines();
    renderMonthLabel();
    renderGrid();
    renderDayPanel();
    updateSpecialTargetLabel();
    setInterval(checkReminders, 30000);
  }

  return { init };
}

let earningsEntries = [];

function mondayOf(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const offset = (dt.getDay() + 6) % 7; // Mon=0
  dt.setDate(dt.getDate() - offset);
  return dateKey(dt.getFullYear(), dt.getMonth(), dt.getDate());
}
function weekRangeLabel(weekStartStr) {
  const [y, m, d] = weekStartStr.split('-').map(Number);
  const start = new Date(y, m - 1, d);
  const end = new Date(y, m - 1, d + 6);
  const sameMonth = start.getMonth() === end.getMonth();
  const startLabel = start.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  const endLabel = end.toLocaleDateString(undefined, sameMonth ? { day: 'numeric', year: 'numeric' } : { month: 'short', day: 'numeric', year: 'numeric' });
  return `${startLabel} – ${endLabel}`;
}

function fmtMoney(n) { const v = Number(n) || 0; return (v < 0 ? '-$' : '$') + Math.abs(v).toFixed(2); }
function netOf(e) { return Number(e.amount || 0) + Number(e.tips || 0) - Number(e.mommy_fee || 0) - Number(e.transport_fee || 0); }
const PAY_LABEL = { full: 'Full', partial: 'Partial', not_received: 'Not received' };

function renderMommyFilterOptions() {
  const sel = document.getElementById('mommyFilter');
  const names = Array.from(new Set(earningsEntries.map(e => (e.mommy || '').trim()).filter(Boolean))).sort();
  const current = sel.value;
  sel.innerHTML = '<option value="">All</option>' + names.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
  if (names.includes(current)) sel.value = current;
}

function renderLocationFilterOptions() {
  const sel = document.getElementById('locationFilter');
  const locs = Array.from(new Set(earningsEntries.map(e => (e.location || '').trim()).filter(Boolean))).sort();
  const current = sel.value;
  sel.innerHTML = '<option value="">All</option>' + locs.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
  if (locs.includes(current)) sel.value = current;
  const datalist = document.getElementById('locationSuggestions');
  datalist.innerHTML = locs.map(n => `<option value="${escapeHtml(n)}">`).join('');
}

function renderYearTabs() {
  const years = Array.from(new Set([
    ...earningsEntries.map(e => e.entry_date.slice(0, 4)),
    ...offWeeks.map(o => o.week_start.slice(0, 4))
  ])).sort();
  const currentYear = String(new Date().getFullYear());
  if (!years.includes(currentYear)) years.push(currentYear);
  years.sort();
  if (!years.includes(yearFilter)) yearFilter = years[years.length - 1];

  const box = document.getElementById('yearTabs');
  box.innerHTML = '';
  years.forEach(y => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'year-tab' + (y === yearFilter ? ' active' : '');
    btn.textContent = y;
    btn.addEventListener('click', () => { yearFilter = y; renderEarnings(); });
    box.appendChild(btn);
  });
}

let currentFilteredEntries = [];

function renderEarnings() {
  renderYearTabs();
  renderMommyFilterOptions();
  renderLocationFilterOptions();
  let filtered = earningsEntries.filter(e => e.entry_date.slice(0, 4) === yearFilter);
  if (mommyFilter) filtered = filtered.filter(e => (e.mommy || '') === mommyFilter);
  if (locationFilter) filtered = filtered.filter(e => (e.location || '') === locationFilter);
  currentFilteredEntries = filtered;

  const totalAmount = filtered.reduce((s, e) => s + Number(e.amount || 0), 0);
  const totalTips = filtered.reduce((s, e) => s + Number(e.tips || 0), 0);
  const totalFee = filtered.reduce((s, e) => s + Number(e.mommy_fee || 0), 0);
  const totalTransport = filtered.reduce((s, e) => s + Number(e.transport_fee || 0), 0);
  document.getElementById('stat-net').textContent = fmtMoney(totalAmount + totalTips - totalFee - totalTransport);

  /* ---- monthly totals ---- */
  const monthTotals = {};
  filtered.forEach(e => { const mk = e.entry_date.slice(0, 7); monthTotals[mk] = (monthTotals[mk] || 0) + netOf(e); });
  const mtBox = document.getElementById('monthTotalsList');
  const monthKeys = Object.keys(monthTotals).sort().reverse();
  const yearTotal = monthKeys.reduce((s, k) => s + monthTotals[k], 0);
  let ytLabel = `Year total — ${yearFilter}`;
  if (locationFilter) ytLabel += ` · ${locationFilter}`;
  if (mommyFilter) ytLabel += ` · ${mommyFilter}`;
  document.getElementById('yearTotalLabel').textContent = ytLabel;
  document.getElementById('yearTotalValue').textContent = fmtMoney(yearTotal);
  mtBox.innerHTML = monthKeys.length === 0 ? '<p style="color:var(--ink-soft); font-size:13px;">Nothing logged yet.</p>' : monthKeys.map(mk => {
    const [y, m] = mk.split('-').map(Number);
    const label = new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    return `<div class="month-total-row"><span>${label}</span><span class="mt-net">${fmtMoney(monthTotals[mk])}</span></div>`;
  }).join('');

  /* ---- weekly groups (entries + off-weeks merged) ---- */
  const weekMap = {};
  filtered.forEach(e => { const wk = mondayOf(e.entry_date); if (!weekMap[wk]) weekMap[wk] = { entries: [], off: null }; weekMap[wk].entries.push(e); });
  offWeeks.filter(o => o.week_start.slice(0, 4) === yearFilter).forEach(o => { const wk = o.week_start; if (!weekMap[wk]) weekMap[wk] = { entries: [], off: null }; weekMap[wk].off = o; });

  const listEl = document.getElementById('earningsList');
  const weekKeys = Object.keys(weekMap).sort().reverse();
  if (weekKeys.length === 0) { listEl.innerHTML = '<div class="empty">No entries yet — add your first one above.</div>'; return; }

  listEl.innerHTML = '';
  weekKeys.forEach(wk => {
    const group = weekMap[wk];
    const weekNet = group.entries.reduce((s, e) => s + netOf(e), 0);
    const wrap = document.createElement('div'); wrap.className = 'week-group';

    const head = document.createElement('div'); head.className = 'week-group-head';
    head.innerHTML = `<span class="week-group-label">${weekRangeLabel(wk)}</span><span class="week-group-total">${fmtMoney(weekNet)}</span>`;
    wrap.appendChild(head);

    if (group.off) {
      const banner = document.createElement('div'); banner.className = 'off-week-banner';
      const txt = document.createElement('div'); txt.className = 'txt';
      txt.innerHTML = `<b>Unable to work this week</b>${escapeHtml(group.off.reason)}`;
      const del = document.createElement('button'); del.type = 'button'; del.textContent = '×'; del.title = 'Remove';
      del.addEventListener('click', () => deleteOffWeek(group.off.id));
      banner.appendChild(txt); banner.appendChild(del);
      wrap.appendChild(banner);
    }

    group.entries.sort((a, b) => b.entry_date.localeCompare(a.entry_date)).forEach(e => {
      const card = document.createElement('div'); card.className = 'earn-card';
      const top = document.createElement('div'); top.className = 'earn-card-top';
      const left = document.createElement('div'); left.className = 'earn-card-left';
      left.innerHTML = `<span class="earn-card-date">${e.entry_date}</span>` + (e.location ? `<span class="earn-card-location">${escapeHtml(e.location)}</span>` : '') + (e.mommy ? `<span class="earn-card-mommy">${escapeHtml(e.mommy)}</span>` : '') + (e.table_count ? `<span class="meta-chip">台數 ${escapeHtml(e.table_count)}</span>` : '');
      const right = document.createElement('div'); right.className = 'earn-card-right';
      const payTag = document.createElement('span'); payTag.className = 'pay-tag ' + (e.payment_status || 'not_received'); payTag.textContent = PAY_LABEL[e.payment_status] || 'Not received';
      const net = document.createElement('span'); net.className = 'earn-card-net'; net.textContent = fmtMoney(netOf(e));
      const delBtn = document.createElement('button'); delBtn.type = 'button'; delBtn.className = 'icon-btn'; delBtn.textContent = '×'; delBtn.title = 'Remove';
      delBtn.addEventListener('click', () => deleteEarning(e.id));
      right.appendChild(payTag); right.appendChild(net); right.appendChild(delBtn);
      top.appendChild(left); top.appendChild(right);
      card.appendChild(top);

      const meta = document.createElement('div'); meta.className = 'earn-card-meta';
      const metaParts = [`Amount ${fmtMoney(e.amount)}`, `Tips ${fmtMoney(e.tips)}`, `Mommy fee ${fmtMoney(-e.mommy_fee)}`];
      if (e.transport_fee) metaParts.push(`Transport ${fmtMoney(-e.transport_fee)}`);
      if (e.payment_method) metaParts.push('Via ' + (e.payment_method === 'zelle' ? 'Zelle' : 'Cash'));
      if (e.received_date) metaParts.push('Received ' + e.received_date);
      metaParts.forEach(p => { const chip = document.createElement('span'); chip.className = 'meta-chip'; chip.textContent = p; meta.appendChild(chip); });
      card.appendChild(meta);

      if (e.notes) { const notes = document.createElement('div'); notes.className = 'earn-card-notes'; notes.textContent = e.notes; card.appendChild(notes); }
      wrap.appendChild(card);
    });

    listEl.appendChild(wrap);
  });
}

function renderFoa() {
  renderFoaYearTabs();
  const filtered = foaEntries.filter(e => e.pay_date.slice(0, 4) === foaYearFilter);
  currentFoaFiltered = filtered;

  const currentMonthKey = todayKey().slice(0, 7);
  const thisMonthTotal = foaEntries.filter(e => e.pay_date.slice(0, 7) === currentMonthKey).reduce((s, e) => s + Number(e.amount || 0), 0);
  document.getElementById('foaThisMonthValue').textContent = fmtMoney(thisMonthTotal);

  const yearTotal = filtered.reduce((s, e) => s + Number(e.amount || 0), 0);
  document.getElementById('foaYearTotalLabel').textContent = `Year total — ${foaYearFilter}`;
  document.getElementById('foaYearTotalValue').textContent = fmtMoney(yearTotal);

  const monthTotals = {};
  filtered.forEach(e => { const mk = e.pay_date.slice(0, 7); if (!monthTotals[mk]) monthTotals[mk] = { sum: 0, count: 0 }; monthTotals[mk].sum += Number(e.amount || 0); monthTotals[mk].count++; });

  mtBox.innerHTML = monthKeys.length === 0 ? '<p style="color:var(--ink-soft); font-size:13px;">Nothing logged yet.</p>' : monthKeys.map(mk => {

    const statutory = document.createElement('div'); statutory.className = 'se-ded'; statutory.textContent = Number(e.statutory_deductions || 0) === 0 ? '—' : fmtMoney(e.statutory_deductions);

/* ============ Spending tab ============ */
let spendEntries = [];
let spendYearFilter = String(new Date().getFullYear());
let spendCardFilter = '';
let spendCategoryFilter = '';
let currentSpendFiltered = [];
const SPEND_CATEGORIES = ['Food', 'Gas', 'Bills', 'Groceries', 'Shopping', 'Rent', 'Entertainment', 'Health', 'Other'];

async function loadSpending() {
  try {
    const res = await fetch(`${REST_BASE}/spending_entries?select=*&order=spend_date.desc`, { headers: SB_HEADERS });
    if (res.ok) spendEntries = await res.json();
  } catch (e) { console.error('spending load error', e); }
}
async function addSpending(entry) {
  try {
    await fetch(`${REST_BASE}/spending_entries`, {
      method: 'POST',
      headers: { ...SB_HEADERS, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify([entry])
    });
  } catch (e) { console.error('spending add error', e); }
  await loadSpending(); renderSpending();
}
async function deleteSpending(id) {
  try { await fetch(`${REST_BASE}/spending_entries?id=eq.${id}`, { method: 'DELETE', headers: SB_HEADERS }); }
  catch (e) { console.error('spending delete error', e); }
  await loadSpending(); renderSpending();
}

function renderSpendYearTabs() {
  const years = Array.from(new Set(spendEntries.map(e => e.spend_date.slice(0, 4))));
  const currentYear = String(new Date().getFullYear());
  if (!years.includes(currentYear)) years.push(currentYear);
  years.sort();
  if (!years.includes(spendYearFilter)) spendYearFilter = years[years.length - 1];
  const box = document.getElementById('spendYearTabs');
  box.innerHTML = '';
  years.forEach(y => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'year-tab' + (y === spendYearFilter ? ' active' : '');
    btn.textContent = y;
    btn.addEventListener('click', () => { spendYearFilter = y; renderSpending(); });
    box.appendChild(btn);
  });
}

function renderSpendFilterOptions() {
  const cardSel = document.getElementById('spendCardFilter');
  const cards = Array.from(new Set(spendEntries.map(e => (e.card || '').trim()).filter(Boolean))).sort();
  const curCard = cardSel.value;
  cardSel.innerHTML = '<option value="">All cards</option>' + cards.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  if (cards.includes(curCard)) cardSel.value = curCard;

  const catSel = document.getElementById('spendCategoryFilter');
  const curCat = catSel.value;
  const cats = Array.from(new Set([...SPEND_CATEGORIES, ...spendEntries.map(e => (e.category || '').trim()).filter(Boolean)]));
  catSel.innerHTML = '<option value="">All categories</option>' + cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  if (cats.includes(curCat)) catSel.value = curCat;

  const cardDatalist = document.getElementById('cardSuggestions');
  cardDatalist.innerHTML = cards.map(c => `<option value="${escapeHtml(c)}">`).join('') + '<option value="Cash">';
}

function renderSpending() {
  renderSpendYearTabs();
  renderSpendFilterOptions();
  let filtered = spendEntries.filter(e => e.spend_date.slice(0, 4) === spendYearFilter);
  if (spendCardFilter) filtered = filtered.filter(e => (e.card || '') === spendCardFilter);
  if (spendCategoryFilter) filtered = filtered.filter(e => (e.category || '') === spendCategoryFilter);
  currentSpendFiltered = filtered;

  const total = filtered.reduce((s, e) => s + Number(e.amount || 0), 0);
  document.getElementById('spendYearTotalLabel').textContent = `Total spending — ${spendYearFilter}`;
  document.getElementById('spendYearTotalValue').textContent = fmtMoney(total);

  const byCard = {};
  filtered.forEach(e => { const c = e.card || 'Cash'; byCard[c] = (byCard[c] || 0) + Number(e.amount || 0); });
  const cardBox = document.getElementById('spendByCard');
  const cardKeys = Object.keys(byCard).sort((a,b) => byCard[b] - byCard[a]);
  cardBox.innerHTML = cardKeys.length === 0 ? '<p style="color:var(--ink-soft); font-size:13px;">Nothing yet.</p>' : cardKeys.map(c => `<div class="breakdown-row"><span>${escapeHtml(c)}</span><span class="br-amt">${fmtMoney(byCard[c])}</span></div>`).join('');

  const byCat = {};
  filtered.forEach(e => { const c = e.category || 'Uncategorized'; byCat[c] = (byCat[c] || 0) + Number(e.amount || 0); });
  const catBox = document.getElementById('spendByCategory');
  const catKeys = Object.keys(byCat).sort((a,b) => byCat[b] - byCat[a]);
  catBox.innerHTML = catKeys.length === 0 ? '<p style="color:var(--ink-soft); font-size:13px;">Nothing yet.</p>' : catKeys.map(c => `<div class="breakdown-row"><span>${escapeHtml(c)}</span><span class="br-amt">${fmtMoney(byCat[c])}</span></div>`).join('');

  const listEl = document.getElementById('spendEntryList');
  if (filtered.length === 0) { listEl.innerHTML = '<div class="empty">No spending logged yet.</div>'; return; }
  listEl.innerHTML = '';
  filtered.slice().sort((a,b) => b.spend_date.localeCompare(a.spend_date)).forEach(e => {
    const row = document.createElement('div'); row.className = 'spend-entry-row';
    const date = document.createElement('div'); date.textContent = e.spend_date;
    const notes = document.createElement('div'); notes.className = 'se-notes'; notes.textContent = e.notes || '';
    const card = document.createElement('div'); card.className = 'sp-card'; card.textContent = e.card || 'Cash';
    const amt = document.createElement('div'); amt.className = 'sp-amount'; amt.textContent = fmtMoney(e.amount);
    const del = document.createElement('button'); del.type = 'button'; del.className = 'icon-btn'; del.textContent = '×'; del.title = 'Remove';
    del.addEventListener('click', () => deleteSpending(e.id));
    row.appendChild(date); row.appendChild(notes); row.appendChild(card); row.appendChild(amt); row.appendChild(del);
    listEl.appendChild(row);
  });
}

document.getElementById('bulkAddBtn').addEventListener('click', async () => {
  const raw = document.getElementById('bulkAddText').value;
  const resultEl = document.getElementById('bulkAddResult');
  const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
  if (lines.length === 0) { resultEl.textContent = 'Paste some rows first.'; return; }

  const statusMap = { full: 'full', partial: 'partial', not_received: 'not_received', '': 'not_received' };
  const entries = [];
  const errors = [];
  lines.forEach((line, i) => {
    const parts = (line.includes('\t') ? line.split('\t') : line.split(',')).map(p => p.trim());
    const [date, location, mommy, tableCount, amount, tips, fee, transportFee, status, method, receivedDate, notes] = parts;
    if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) { errors.push(`Line ${i + 1}: bad or missing date (need YYYY-MM-DD)`); return; }
    entries.push({
      entry_date: date,
      location: location || null,
      mommy: mommy || null,
      table_count: tableCount || null,
      amount: parseFloat(amount) || 0,
      tips: parseFloat(tips) || 0,
      mommy_fee: parseFloat(fee) || 0,
      transport_fee: parseFloat(transportFee) || 0,
      payment_status: statusMap[(status || '').toLowerCase()] || 'not_received',
      payment_method: (method || '').toLowerCase() === 'zelle' ? 'zelle' : ((method || '').toLowerCase() === 'cash' ? 'cash' : null),
      received_date: (receivedDate && /^\d{4}-\d{2}-\d{2}$/.test(receivedDate)) ? receivedDate : null,
      notes: notes || null
    });
  });

  if (entries.length > 0) await addEarningsBatch(entries);
  resultEl.textContent = `Imported ${entries.length} row(s).` + (errors.length ? ` Skipped ${errors.length}: ${errors.join('; ')}` : '');
  if (entries.length > 0) document.getElementById('bulkAddText').value = '';
});

function csvEscape(v) {
  const s = v === null || v === undefined ? '' : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

    e.entry_date, e.location || '', e.mommy || '', e.table_count || '', e.amount, e.tips, e.mommy_fee, e.transport_fee || 0, netOf(e).toFixed(2),
    PAY_LABEL[e.payment_status] || 'Not received', e.payment_method || '', e.received_date || '', e.notes || ''
  ]);
  const csv = [header, ...rows].map(r => r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

function foaAutoFillNet() {
  const gross = parseFloat(document.getElementById('foaGross').value) || 0;
  const statutory = parseFloat(document.getElementById('foaStatutory').value) || 0;
  const other = parseFloat(document.getElementById('foaOther').value) || 0;
  if (gross === 0 && statutory === 0 && other === 0) return;
  document.getElementById('foaAmount').value = (gross - Math.abs(statutory) - Math.abs(other)).toFixed(2);
}
